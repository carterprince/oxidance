[package]
name = "oxidance"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
default-run = "oxidance"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_6"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
async-channel = "2"
gst = { package = "gstreamer", version = "0.25" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39"
